[package]
name = "gpui-highlight-input"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/flaticols/gpui-highlight-input"
description = "A lightweight GPUI single-line input with application-owned highlighted ranges"

[dependencies]
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/flaticols/gpui-component", rev = "f8710cc215105343e48a02ced0bc98874aad42e8", version = "0.5.2" }
gpui-component-assets = { git = "https://github.com/flaticols/gpui-component", rev = "f8710cc215105343e48a02ced0bc98874aad42e8", version = "0.5.1" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }

[dev-dependencies]
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", features = ["test-support"] }
